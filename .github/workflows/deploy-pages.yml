name: 部署 GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态页面
        run: npm run build

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传静态文件
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
